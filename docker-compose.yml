services:
  postgres:
    image: postgres:17
    container_name: "user-service-postgres"
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: admin123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_service_user -d user_service" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  user-service:
    build: .
    container_name: "user-service-app"
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - "./logs:/app/logs"
volumes:
  postgres_data:
